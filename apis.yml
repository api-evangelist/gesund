aid: gesund
name: Gesund
description: 'Gesund.ai is a governance and validation platform for regulated clinical
  AI, providing infrastructure to build, validate, deploy, monitor, and update medical
  AI models across regulatory jurisdictions and stakeholders. Its offerings include
  an AI CRO (contract research organization) delivering independent validation studies
  for medical AI models, an AI Factory to accelerate in-house model R&D cycles, and
  a free Validation Hub for testing models against real-world clinical data. Backed
  by 500 Global and headquartered in Cambridge, Massachusetts, the company focuses
  on inspection-ready evidence and FDA/QMSR-aligned regulatory compliance for clinical
  AI teams. The platform is delivered through a hosted web application and currently
  exposes no public developer API.'
